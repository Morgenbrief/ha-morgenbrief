name: Morgenbrief
version: "1.6.3"
slug: morgenbrief
description: Täglicher Morgenbrief aus Google Kalender und Gmail mit Push aufs Handy
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-sunset-up
panel_title: Morgenbrief
panel_admin: true
homeassistant_api: true
options:
  google_client_id: ""
  google_client_secret: ""
  gemini_api_key: ""
  gemini_modell: auto
  zeit_arbeitstage: "06:54"
  zeit_freie_tage: "06:54"
  zeit_abend: "19:00"
  push_dienst: mobile_app_mein_handy
  push_klick_pfad: /app/local_morgenbrief
  weitere_eigene_adressen: []
  tomtom_api_key: ""
  verkehr_start: ""
  verkehr_ziel: ""
  verkehr_ankunft: "07:25"
  verkehr_schwelle_min: 3
schema:
  google_client_id: str?
  google_client_secret: password?
  gemini_api_key: password?
  gemini_modell: str
  zeit_arbeitstage: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  zeit_freie_tage: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  zeit_abend: match(^(aus|([01][0-9]|2[0-3]):[0-5][0-9])$)?
  push_dienst: str
  push_klick_pfad: str
  weitere_eigene_adressen:
    - str
  tomtom_api_key: password?
  verkehr_start: str?
  verkehr_ziel: str?
  verkehr_ankunft: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  verkehr_schwelle_min: int(1,60)?
  wetter_entitaet: str?
